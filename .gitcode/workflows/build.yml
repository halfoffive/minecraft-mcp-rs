# ═══════════════════════════════════════════════════════════════════════
# AtomGit Action 流水线 — 镜像 .github/workflows/build.yml
# ═══════════════════════════════════════════════════════════════════════
# (a) 本文件镜像 .github/workflows/build.yml 的多平台多架构 dev 二进制构建 + lint/test
#     作业，适配 AtomGit Action 语法。
# (b) macOS（macos-aarch64）与 Windows arm64（windows-aarch64）需自托管 runner
#     （runs-on: [self-hosted, ...]）；AtomGit 文档未提供对应托管 runner，v1 不纳入
#     默认矩阵。
# (c) v1 不启用 cargo 缓存（AtomGit cache action 名称未在文档确认）；依赖
#     rust-toolchain.toml 已 pin nightly，每次流水线全新安装工具链。
# (d) concurrency.exceed-action 用 IGNORE（AtomGit 仅支持 IGNORE / QUEUE，不支持
#     CANCEL），与 GitHub 的 cancel-in-progress: true 语义不同：旧运行不会被取消，
#     新触发会被忽略，以避免运行堆积。
# (e) 工作流目录为 .gitcode/workflows/（非 .github/workflows/）。
name: Build (multi-platform, multi-arch)

concurrency:
  enable: true
  max: 1
  exceed-action: IGNORE

on:
  push:
    branches:
      - master
    paths:
      - '.gitcode/workflows/build.yml'
      - 'src/**'
      - 'tests/**'
      - 'patches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  pull_request:
    paths:
      - '.gitcode/workflows/build.yml'
      - 'src/**'
      - 'tests/**'
      - 'patches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  repository: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on:
      - ${{ matrix.runner }}
      - ${{ matrix.arch }}
      - small
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24
            arch: x64
            label: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24
            arch: arm64
            label: linux-aarch64
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            arch: x64
            label: windows-x86_64

    steps:
      - name: Checkout
        uses: checkout

      - name: Install Rust nightly
        shell: bash
        run: |
          rustup toolchain install nightly --component rust-src --profile minimal
          rustup default nightly
          rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/debug/minecraft-mcp-rs.exe" "minecraft-mcp-rs-${{ matrix.label }}.exe"
          else
            cp "target/${{ matrix.target }}/debug/minecraft-mcp-rs" "minecraft-mcp-rs-${{ matrix.label }}"
          fi

      - name: Upload artifact
        uses: upload-artifact
        with:
          name: minecraft-mcp-rs-${{ matrix.label }}
          path: minecraft-mcp-rs-${{ matrix.label }}*

  lint:
    name: Lint & Test
    runs-on: [ubuntu-24, x64, small]
    steps:
      - name: Checkout
        uses: checkout

      - name: Install Rust nightly
        shell: bash
        run: |
          rustup toolchain install nightly --component rustfmt,clippy --profile minimal
          rustup default nightly

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --check
