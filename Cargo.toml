[package]
name = "minecraft-mcp-rs"
version = "1.4.1-rc.1"
edition = "2024"
description = "MCP server that controls a Minecraft bot (azalea-backed) — move, mine, build, fight and chat via LLM tools"
license = "MIT"

[dependencies]
azalea = "0.15.1"
azalea-inventory = "0.15.1"
rmcp = { version = "1.8.0", features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }
eframe = "0.34.3"
egui = "0.34.3"
tokio = { version = "1.50", features = ["full"] }
arc-swap = "1.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
schemars = "1.0.3"
proptest = "1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["fmt", "env-filter", "ansi"] }
eyre = "0.6.12"
thiserror = "2.0.12"
bevy_ecs = "0.18"
uuid = "1.20"
tokio-util = { version = "0.7", features = ["rt"] }
image = "0.25"
base64 = "0.22"
axum = "0.8"
sys-locale = "0.3"
clap = { version = "4.6.6", features = ["derive", "color"] }

# Test-only: construct azalea ECS worlds in unit tests (InstanceHolder
# fields use parking_lot locks). Already in the dependency graph via azalea.
[dev-dependencies]
parking_lot = "0.12"
# F-3: drive the axum Router with `oneshot` in the server-layer tests.
tower = { version = "0.5", features = ["util"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[lints.rust]
linker_messages = "allow"

# Doc-link hygiene: keep `cargo doc --no-deps` warning-free (enforced in CI).
[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
redundant_explicit_links = "deny"

# Local patches to resolve dependency conflicts.
# These directories are tracked in git (see README.md for license notes).
[patch.crates-io]
rsa = { path = "patches/rsa" }
rmcp = { path = "patches/rmcp" }

[build-dependencies]
winresource = "0.1.31"


