# CI split (branch model — reduces compile time):
#
# - develop PUSH: the full gate — lint (fmt → clippy → test/doc) plus
#   the multi-platform dev-profile matrix build. Runs once per merged change.
# - PULL REQUEST to develop: lint ONLY (fast gate; the expensive matrix
#   build is skipped).
# - release / pre-release channels: release.yml performs ONLY `--release`
#   builds + publish (the run-once checks already ran on develop).
#
# master is stable-only and covered by the release pipeline.
name: Build (multi-platform, multi-arch)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - develop
    paths:
      - '.github/workflows/build.yml'
      - 'src/**'
      - 'tests/**'
      - 'patches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  pull_request:
    branches:
      - develop
    paths:
      - '.github/workflows/build.yml'
      - 'src/**'
      - 'tests/**'
      - 'patches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.label }}
    # The multi-platform matrix build runs once per change — on the develop
    # push. PRs get the fast lint gate only.
    if: github.event_name != 'pull_request'
    needs: lint
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            label: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            label: linux-aarch64
          - target: aarch64-apple-darwin
            runner: macos-latest
            label: macos-aarch64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            label: windows-x86_64
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            label: windows-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}

      - name: Build
        run: cargo build --locked --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/debug/minecraft-mcp-rs.exe" "minecraft-mcp-rs-${{ matrix.label }}.exe"
          else
            cp "target/${{ matrix.target }}/debug/minecraft-mcp-rs" "minecraft-mcp-rs-${{ matrix.label }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: minecraft-mcp-rs-${{ matrix.label }}
          path: minecraft-mcp-rs-${{ matrix.label }}*
          if-no-files-found: error

  lint:
    name: fmt → clippy → test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: lint-ubuntu

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # [lints.rustdoc] in Cargo.toml denies broken/private intra-doc links,
      # so any regression here fails the job.
      - name: Check rustdoc links
        run: cargo doc --locked --no-deps

      # --no-fail-fast: one broken target must not hide the results of the
      # remaining targets (lib → integration → proptest).
      - name: Run tests
        run: cargo test --locked --all-targets --no-fail-fast

      # Doctests are NOT part of --all-targets; keep them covered explicitly.
      - name: Run doctests
        run: cargo test --locked --doc
