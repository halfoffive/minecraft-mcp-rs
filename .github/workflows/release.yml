# Two-channel release pipeline (see CONTRIBUTING.md for the branch model):
#
#   - push to the `release` branch → PRE-RELEASE: GitHub Release marked
#     prerelease (never "Latest") + npm dist-tag `next`. The tag name is
#     derived from Cargo.toml (`v` + version, which must carry a pre-release
#     suffix like `1.3.0-rc.1`). Re-pushing an unchanged version is
#     idempotent (an existing release and already-published npm versions are
#     skipped).
#   - push a `v*` tag (normally on `master`) → STABLE: GitHub "Latest
#     Release" + npm dist-tag `latest`. A tag whose name contains a hyphen
#     (e.g. `v1.3.0-rc.1`) or that was pushed from the `release` branch is
#     also treated as a pre-release.
#
# `workflow_dispatch` still allows manual runs with a `prerelease` override.
#
# Windows artifacts are packaged as both .zip and .7z.
# Linux/macOS artifacts are packaged as both .tar.xz and .tar.gz.
name: Release

on:
  push:
    branches:
      - release
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Mark as prerelease'
        required: false
        default: false
        type: boolean
      tag:
        description: 'Tag to publish (e.g. v1.1.0); empty = current ref'
        required: false
        default: ''
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  # Determines the release channel (pre-release vs stable) once, so the
  # `release` and `npm-publish` jobs share a single decision. Pre-release
  # when: a branch push (only `release` triggers this workflow), the tag
  # name contains a hyphen, the tag's base branch is `release`, or a manual
  # dispatch sets the `prerelease` input.
  mode:
    name: Determine release mode
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.mode.outputs.prerelease }}
      npm_tag: ${{ steps.mode.outputs.npm_tag }}
    steps:
      - name: Decide
        id: mode
        shell: bash
        run: |
          pre="false"
          if [ "${{ github.ref_type }}" = "branch" ]; then pre="true"; fi
          case "${{ github.ref_name }}" in *-*) pre="true" ;; esac
          if [ "${{ github.event.base_ref }}" = "refs/heads/release" ]; then pre="true"; fi
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then pre="true"; fi
          if [ "$pre" = "true" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            label: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            label: linux-aarch64
          - target: aarch64-apple-darwin
            runner: macos-latest
            label: macos-aarch64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            label: windows-x86_64
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            label: windows-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.label }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Strip binary
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/minecraft-mcp-rs

      - name: Stage artifact
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/minecraft-mcp-rs.exe" "minecraft-mcp-rs-${{ matrix.label }}.exe"
          else
            cp "target/${{ matrix.target }}/release/minecraft-mcp-rs" "minecraft-mcp-rs-${{ matrix.label }}"
          fi

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $base = "minecraft-mcp-rs-${{ matrix.label }}"
          $exe = "${base}.exe"

          # .zip via built-in PowerShell
          Compress-Archive -Path $exe -DestinationPath "${base}.zip" -Force

          # .7z via 7-Zip (install if not present)
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          if (-not (Test-Path $sevenZip)) {
            choco install 7zip -y --no-progress
          }
          & $sevenZip a -t7z -mx=9 "${base}.7z" $exe

      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          base="minecraft-mcp-rs-${{ matrix.label }}"
          tar -cJf "${base}.tar.xz" "$base"
          tar -czf "${base}.tar.gz" "$base"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: minecraft-mcp-rs-${{ matrix.label }}
          path: minecraft-mcp-rs-${{ matrix.label }}.*
          if-no-files-found: error

  lint:
    name: fmt → clippy → test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-lint-ubuntu

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

  release:
    name: Create GitHub Release
    needs: [build, lint, mode]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Derive release tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            ver=$(grep '^version' Cargo.toml | head -1 | sed -E 's/version = "([^"]+)"/\1/')
            echo "tag=v${ver}" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip when the release already exists
        id: exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::release ${{ steps.version.outputs.tag }} already exists — skipping creation"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Flatten artifacts for release
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Generate bilingual release notes
        run: |
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          base_url="https://github.com/${repo}/releases/download/${tag}"

          cat > release-body.md <<EOF
          ## Downloads | 下载

          | Platform | Architecture | Format | Download |
          |----------|--------------|--------|----------|
          | Windows | x86_64 | zip | [minecraft-mcp-rs-windows-x86_64.zip](${base_url}/minecraft-mcp-rs-windows-x86_64.zip) |
          | Windows | x86_64 | 7z | [minecraft-mcp-rs-windows-x86_64.7z](${base_url}/minecraft-mcp-rs-windows-x86_64.7z) |
          | Windows | aarch64 | zip | [minecraft-mcp-rs-windows-aarch64.zip](${base_url}/minecraft-mcp-rs-windows-aarch64.zip) |
          | Windows | aarch64 | 7z | [minecraft-mcp-rs-windows-aarch64.7z](${base_url}/minecraft-mcp-rs-windows-aarch64.7z) |
          | macOS | aarch64 | tar.xz | [minecraft-mcp-rs-macos-aarch64.tar.xz](${base_url}/minecraft-mcp-rs-macos-aarch64.tar.xz) |
          | macOS | aarch64 | tar.gz | [minecraft-mcp-rs-macos-aarch64.tar.gz](${base_url}/minecraft-mcp-rs-macos-aarch64.tar.gz) |
          | Linux | x86_64 | tar.xz | [minecraft-mcp-rs-linux-x86_64.tar.xz](${base_url}/minecraft-mcp-rs-linux-x86_64.tar.xz) |
          | Linux | x86_64 | tar.gz | [minecraft-mcp-rs-linux-x86_64.tar.gz](${base_url}/minecraft-mcp-rs-linux-x86_64.tar.gz) |
          | Linux | aarch64 | tar.xz | [minecraft-mcp-rs-linux-aarch64.tar.xz](${base_url}/minecraft-mcp-rs-linux-aarch64.tar.xz) |
          | Linux | aarch64 | tar.gz | [minecraft-mcp-rs-linux-aarch64.tar.gz](${base_url}/minecraft-mcp-rs-linux-aarch64.tar.gz) |

          | 平台 | 架构 | 格式 | 下载 |
          |------|------|------|------|
          | Windows | x86_64 | zip | [minecraft-mcp-rs-windows-x86_64.zip](${base_url}/minecraft-mcp-rs-windows-x86_64.zip) |
          | Windows | x86_64 | 7z | [minecraft-mcp-rs-windows-x86_64.7z](${base_url}/minecraft-mcp-rs-windows-x86_64.7z) |
          | Windows | aarch64 | zip | [minecraft-mcp-rs-windows-aarch64.zip](${base_url}/minecraft-mcp-rs-windows-aarch64.zip) |
          | Windows | aarch64 | 7z | [minecraft-mcp-rs-windows-aarch64.7z](${base_url}/minecraft-mcp-rs-windows-aarch64.7z) |
          | macOS | aarch64 | tar.xz | [minecraft-mcp-rs-macos-aarch64.tar.xz](${base_url}/minecraft-mcp-rs-macos-aarch64.tar.xz) |
          | macOS | aarch64 | tar.gz | [minecraft-mcp-rs-macos-aarch64.tar.gz](${base_url}/minecraft-mcp-rs-macos-aarch64.tar.gz) |
          | Linux | x86_64 | tar.xz | [minecraft-mcp-rs-linux-x86_64.tar.xz](${base_url}/minecraft-mcp-rs-linux-x86_64.tar.xz) |
          | Linux | x86_64 | tar.gz | [minecraft-mcp-rs-linux-x86_64.tar.gz](${base_url}/minecraft-mcp-rs-linux-x86_64.tar.gz) |
          | Linux | aarch64 | tar.xz | [minecraft-mcp-rs-linux-aarch64.tar.xz](${base_url}/minecraft-mcp-rs-linux-aarch64.tar.xz) |
          | Linux | aarch64 | tar.gz | [minecraft-mcp-rs-linux-aarch64.tar.gz](${base_url}/minecraft-mcp-rs-linux-aarch64.tar.gz) |
          EOF

          cat release-body.md

      - name: Create Release
        if: steps.exists.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          body_path: release-body.md
          draft: false
          prerelease: ${{ needs.mode.outputs.prerelease }}
          make_latest: ${{ needs.mode.outputs.prerelease == 'true' && 'false' || 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true

  # ── npm publish ─────────────────────────────────────────────────────────
  # Publishes the six npm packages (5 platform packages + the main launcher)
  # built from the same artifacts as the GitHub Release.
  #
  # Authentication supports BOTH modes (npm picks whichever is available):
  #   1. NPM_TOKEN secret (preferred for re-runs / manual runs): a GRANULAR
  #      access token (legacy classic tokens were removed by npm in Nov 2025)
  #      with Read+Write packages scope. When the secret exists, setup-node
  #      writes it into .npmrc via NODE_AUTH_TOKEN and npm authenticates with
  #      it. The token is NEVER written to any file — only referenced via
  #      `secrets.NPM_TOKEN`.
  #   2. npm Trusted Publishing (preferred going forward): with
  #      `id-token: write`, `npm publish --provenance` automatically exchanges
  #      the GitHub OIDC token for a short-lived npm token — NO token secret
  #      needed, and provenance attestations are generated. Configure each of
  #      the six packages on npmjs.com: package page → Settings → Trusted
  #      Publishers → Link GitHub Actions with this repository, owner
  #      `halfoffive`, workflow `release.yml` (no environment required).
  # - `--provenance` requires `id-token: write` and a GitHub-hosted runner.
  # - Publish order is platform-first, main last (the main package's
  #   optionalDependencies must already exist on the registry).
  # - Re-runs (workflow_dispatch with a `tag` input) skip versions that are
  #   already published.
  # - A dispatch without a `tag` input on a non-tag ref publishes whatever
  #   version the checked-out tree holds — acceptable for re-runs.
  npm-publish:
    name: Publish to npm
    needs: [build, lint, mode]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Stage platform binaries into npm packages
        shell: bash
        run: |
          set -euo pipefail
          # Each artifact holds the staged binary plus .zip/.7z (Windows) or
          # .tar.xz/.tar.gz (Unix) archives. Extract the binary from the
          # archive so the step fails if an expected archive is missing.
          mkdir -p /tmp/npm-stage

          unzip -j artifacts/minecraft-mcp-rs-windows-x86_64/minecraft-mcp-rs-windows-x86_64.zip \
            -d /tmp/npm-stage/windows-x64 >/dev/null
          cp /tmp/npm-stage/windows-x64/minecraft-mcp-rs-windows-x86_64.exe \
            npm/minecraft-mcp-rs-windows-x64/minecraft-mcp-rs.exe

          unzip -j artifacts/minecraft-mcp-rs-windows-aarch64/minecraft-mcp-rs-windows-aarch64.zip \
            -d /tmp/npm-stage/windows-arm64 >/dev/null
          cp /tmp/npm-stage/windows-arm64/minecraft-mcp-rs-windows-aarch64.exe \
            npm/minecraft-mcp-rs-windows-arm64/minecraft-mcp-rs.exe

          mkdir -p /tmp/npm-stage/darwin-arm64
          tar -xzf artifacts/minecraft-mcp-rs-macos-aarch64/minecraft-mcp-rs-macos-aarch64.tar.gz \
            -C /tmp/npm-stage/darwin-arm64
          cp /tmp/npm-stage/darwin-arm64/minecraft-mcp-rs-macos-aarch64 \
            npm/minecraft-mcp-rs-darwin-arm64/minecraft-mcp-rs
          chmod +x npm/minecraft-mcp-rs-darwin-arm64/minecraft-mcp-rs

          mkdir -p /tmp/npm-stage/linux-x64
          tar -xzf artifacts/minecraft-mcp-rs-linux-x86_64/minecraft-mcp-rs-linux-x86_64.tar.gz \
            -C /tmp/npm-stage/linux-x64
          cp /tmp/npm-stage/linux-x64/minecraft-mcp-rs-linux-x86_64 \
            npm/minecraft-mcp-rs-linux-x64/minecraft-mcp-rs
          chmod +x npm/minecraft-mcp-rs-linux-x64/minecraft-mcp-rs

          mkdir -p /tmp/npm-stage/linux-arm64
          tar -xzf artifacts/minecraft-mcp-rs-linux-aarch64/minecraft-mcp-rs-linux-aarch64.tar.gz \
            -C /tmp/npm-stage/linux-arm64
          cp /tmp/npm-stage/linux-arm64/minecraft-mcp-rs-linux-aarch64 \
            npm/minecraft-mcp-rs-linux-arm64/minecraft-mcp-rs
          chmod +x npm/minecraft-mcp-rs-linux-arm64/minecraft-mcp-rs

          ls -la npm/minecraft-mcp-rs-windows-x64 npm/minecraft-mcp-rs-windows-arm64 \
            npm/minecraft-mcp-rs-darwin-arm64 npm/minecraft-mcp-rs-linux-x64 \
            npm/minecraft-mcp-rs-linux-arm64

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Sync npm versions from Cargo.toml
        run: node npm/scripts/sync-versions.mjs

      - name: Publish packages (platform first, then main)
        env:
          # Optional: only set when the NPM_TOKEN secret exists. Without it,
          # npm falls back to Trusted Publishing via the OIDC token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for dir in \
            npm/minecraft-mcp-rs-windows-x64 \
            npm/minecraft-mcp-rs-windows-arm64 \
            npm/minecraft-mcp-rs-darwin-arm64 \
            npm/minecraft-mcp-rs-linux-x64 \
            npm/minecraft-mcp-rs-linux-arm64 \
            npm/minecraft-mcp-rs; do
            name=$(node -p "require('./' + process.argv[1] + '/package.json').name" "$dir")
            ver=$(node -p "require('./' + process.argv[1] + '/package.json').version" "$dir")
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "::notice::$name@$ver already published — skipping"
            else
              (cd "$dir" && npm publish --provenance --access public --tag "${{ needs.mode.outputs.npm_tag }}")
            fi
          done
